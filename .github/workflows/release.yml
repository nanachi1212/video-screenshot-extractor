name: Release Video Screenshot Extractor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Run Unit Tests
        run: |
          python -m unittest -v test_gui_core.GuiCoreTests

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Download Pinned External Tools
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\fetch-tools.ps1

      - name: Build Onedir & Inno Setup Installer
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build.ps1 -BuildInstaller

      - name: Create Portable Zip
        run: |
          powershell -Command "Compress-Archive -Path .\dist\VideoScreenshotExtractor\* -DestinationPath .\release\VideoScreenshotExtractor-Portable-${{ github.ref_name }}.zip -Force"

      - name: Generate Checksums
        run: |
          powershell -Command "Get-ChildItem .\release | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content .\release\SHA256SUMS.txt"
          cat .\release\SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*
          generate_release_notes: true
