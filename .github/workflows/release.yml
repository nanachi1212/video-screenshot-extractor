name: Release Video Screenshot Extractor

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Run Unit Tests
        run: |
          python -m unittest -v test_gui_core.GuiCoreTests

      - name: Verify PowerShell Scripts ASCII-only and Syntax
        shell: pwsh
        run: |
          python -c "from pathlib import Path; [(exit(f'Error in {f.name}') if [b for b in f.read_bytes() if b > 127] else None) for f in Path('scripts').glob('*.ps1')]; print('All .ps1 files are 100% ASCII-only.')"
          powershell.exe -NoProfile -Command "Get-ChildItem 'scripts/*.ps1' | ForEach-Object { `$tokens = `$null; `$errors = `$null; `$null = [System.Management.Automation.Language.Parser]::ParseFile(`$_.FullName, [ref]`$tokens, [ref]`$errors); if (`$errors.Count -gt 0) { throw (`$errors[0].Message) } }; Write-Host 'All .ps1 scripts verified 0 parse errors in Windows PowerShell 5.1.'"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Download Pinned External Tools
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File .\scripts\fetch-tools.ps1

      - name: Build Onedir & Inno Setup Installer
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File .\scripts\build.ps1 -BuildInstaller

      - name: Create Portable Zip
        shell: pwsh
        run: |
          $ver = (Get-Content .\VERSION -Raw).Trim()
          $tagOrVer = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$ver" }
          Compress-Archive -Path .\dist\VideoScreenshotExtractor\* -DestinationPath ".\release\VideoScreenshotExtractor-Portable-$tagOrVer.zip" -Force

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-ChildItem .\release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content .\release\SHA256SUMS.txt -Encoding ascii
          Get-Content .\release\SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoScreenshotExtractor-build-artifacts
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release/*
          generate_release_notes: true
